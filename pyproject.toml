[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bridge-cli"
dynamic = ["version"]
description = "Terminal browser and manager for local Claude Code, Codex and Cursor CLI sessions, with optional ai-bridge integration."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "numanzahid" }]
keywords = ["claude-code", "codex", "cursor", "tui", "textual", "sessions", "mcp"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
# Textual is the only runtime dependency; minor releases within 8.x are API-compatible.
dependencies = ["textual>=8.2,<9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ai-bridge = "ai_bridge_cli.cli:main"
ai-bridge-cli = "ai_bridge_cli.cli:main"

# Single source of truth: ai_bridge_cli.__version__ (see "Releasing" in README.md).
[tool.setuptools.dynamic]
version = { attr = "ai_bridge_cli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_bridge_cli = ["tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
