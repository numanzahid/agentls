[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentls"
dynamic = ["version"]
description = "Terminal browser and manager for local Claude Code, Codex and Cursor CLI sessions."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "numanzahid" }]
keywords = ["claude-code", "codex", "cursor", "tui", "textual", "sessions", "mcp"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
# Textual is the only runtime dependency; minor releases within 8.x are API-compatible.
dependencies = ["textual>=8.2,<9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agentls = "agentls.cli:main"

# Single source of truth: agentls.__version__ (see docs/development.md, "Releasing").
[tool.setuptools.dynamic]
version = { attr = "agentls.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentls = ["tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
